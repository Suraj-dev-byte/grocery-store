<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="output.css">
  <script src="product.js" defer></script>
</head>

<body>
  <div class="max-w-6xl mx-auto p-4 md:p-8 font-sans text-gray-800">

    <!-- Breadcrumb -->
    <div class="flex items-center  text-sm text-gray-500 mb-8 space-x-2">
      <a href="#" class="hover:text-gray-800 transition-colors">Home</a>
      <i class="fa-solid fa-chevron-right text-[10px]"></i>
      <a href="#" class="hover:text-gray-800 transition-colors">Groceries</a>
      <i class="fa-solid fa-chevron-right text-[10px]"></i>
      <a href="#" class="hover:text-gray-800 transition-colors">Fruits</a>
      <i class="fa-solid fa-chevron-right text-[10px]"></i>
      <span class="text-gray-800 font-medium">Organic Bananas</span>
    </div>

    <!-- Main Product Section -->
    <div class="flex flex-col md:flex-row gap-10">

      <!-- Left Column: Images -->
      <div class="w-full md:w-1/2 flex flex-col gap-4">
        <!-- Main Image -->
        <div class="mainImg bg-gray-50 rounded-lg flex justify-center items-center p-8 h-[400px]">
          <img src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=500&q=80"
            alt="Premium Organic Bananas" class="max-h-full object-contain drop-shadow-md">
        </div>

        <!-- Thumbnails -->
        <div class="flex gap-4 justify-center">
          <div
            class="w-20 h-20 bg-gray-50 rounded-md border-2 border-gray-800 p-2 cursor-pointer flex justify-center items-center">
            <img src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=100&q=80" alt="Thumb 1"
              class="miniImg ">
          </div>
          <div
            class="w-20 h-20 bg-gray-50 rounded-md border border-gray-200 p-2 cursor-pointer flex justify-center items-center hover:border-gray-400 transition-colors">
            <img src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=100&q=80" alt="Thumb 2"
              class="miniImg">
          </div>
          <div
            class="w-20 h-20 bg-gray-50 rounded-md border border-gray-200 p-2 cursor-pointer flex justify-center items-center hover:border-gray-400 transition-colors">
            <img src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=100&q=80" alt="Thumb 3"
              class="miniImg">
          </div>
          <div
            class="w-20 h-20 bg-gray-50 rounded-md border border-gray-200 p-2 cursor-pointer flex justify-center items-center hover:border-gray-400 transition-colors">
            <img src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=100&q=80" alt="Thumb 4"
              class="miniImg">
          </div>
        </div>
      </div>

      <!-- Right Column: Details -->
      <div class="w-full md:w-1/2 flex flex-col pt-2">
        <span class="text-gray-500 text-sm mb-1">Organic Farms</span>
        <h1 class="productName text-3xl font-semibold text-gray-900 mb-3">Premium Organic Bananas (Bunch of 5-7)</h1>
        <p class="productDescrip text-gray-600 text-sm leading-relaxed mb-4">Sweet, naturally ripened bananas. Perfect
          for snacking,
          smoothies, or baking. Sourced from certified organic farms.</p>

        <!-- Rating -->
        <div class="flex items-center gap-2 mb-6 text-sm">
          <div class="text-yellow-400 flex gap-0.5 text-xs">
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star-half-stroke"></i>
          </div>
          <span class="rating font-bold text-gray-800">4.5</span>
          <span class="reviews text-gray-500">(128 Reviews)</span>
        </div>

        <!-- Variant -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-2">Variant</label>
          <div class="relative w-full max-w-sm">
            <select
              class="w-full border border-gray-300 rounded-md py-2.5 px-3 appearance-none focus:outline-none focus:ring-1 focus:ring-green-600 focus:border-green-600 text-sm bg-white cursor-pointer">
              <option>Weight: Bunch (~800g)</option>
              <option>Weight: 1 Dozen</option>
            </select>
            <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-gray-400 text-xs">
              <i class="fa-solid fa-chevron-down"></i>
            </div>
          </div>
        </div>

        <!-- Price -->
        <div class="flex items-center gap-3 mb-2">
          <!-- <span class="price text-4xl font-semibold text-gray-900"></span> -->
          <span class="price text-gray-400  text-base mb-1">MRP</span>
          <span class="bg-[#fdf0e6] text-[#b36a3e] text-xs font-medium px-2.5 py-1 rounded mb-1.5">Save £0.50</span>
        </div>

        <p class="text-sm text-gray-700 mb-6">Delivery by 7 PM today.</p>

        <!-- Actions (Quantity & Cart) -->
        <div class="flex items-center gap-4">
          <!-- Quantity Selector -->
          <div class="flex items-center border border-gray-300 rounded-md h-11">
            <button
              class="px-3.5 h-full text-gray-500 hover:bg-gray-50 transition-colors flex justify-center items-center">
              <span>+</span>
            </button>
            <input type="text" value="1"
              class="w-10 text-center font-medium text-sm text-gray-800 border-x border-gray-200 h-full focus:outline-none"
              readonly>
            <button
              class="px-3.5 h-full text-gray-500 hover:bg-gray-50 transition-colors flex justify-center items-center">
              <span>-</span></button>
          </div>

          <!-- Add to Cart Button -->
          <button
            class="bg-[#419860] hover:bg-[#347d4e] transition-colors text-white font-medium text-sm px-8 py-3 rounded-md flex-1 max-w-[220px]">
            Add to Cart
          </button>
        </div>

      </div>
    </div>
  </div>

</body>

</html>
