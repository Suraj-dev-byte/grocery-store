<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=\, initial-scale=1.0">
  <title>OwnMart</title>
  <link rel="stylesheet" href="output.css">
  <script src="script.js" defer></script>
  <link
    href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body class="bg-black text-white font-['Poppins']">
  <nav>
    <div class="w-full h-full bg-white flex items-center flex-wrap p-5 justify-evenly">
      <div class="flex items-center">
        <h1 class="text-[#10a390] text-3xl flex items-center">
          <i class="fa-solid fa-cart-shopping"></i>
          OwnCart
        </h1>
        <hr class="bg-gray-500 h-px w-12 rotate-90">
        </hr>
        <div class="bg-[#e0e0de] text-black max-w-24 text-center rounded-[5px] py-1">10-20 Delivery</div>
      </div>
      <div class="flex relative">
        <div class="text-black bg-[#e0e0de] w-full max-w-36 px-2 py-3.5 rounded-l-xl">
          <i class="fa-solid fa-location-dot"></i>
          Location >
        </div>
        <input
          class="bg-[#e0e0de] text-md text-black pl-2 w-full xl:min-w-2xl outline-none border-none min-w-52 rounded-r-xl"
          type="text" placeholder="Search for groceries">
        <div class="bg-[#017369] p-3  rounded-r-xl absolute right-0 text-lg">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
      </div>
      <ul class="text-black flex items-center gap-2 text-lg">
        <li><a href="">Login /</a></li>
        <li><a href="">Account</a></li>
        <i class="fa-regular fa-circle-user"></i>
      </ul>
      <div class="text-black text-xl">
        <i class="fa-solid fa-cart-shopping"></i>
        <a href="">Cart</a>
      </div>
    </div>
  </nav>
</body>

</html>
