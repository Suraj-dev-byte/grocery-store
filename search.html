<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="output.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <script src="search.js" defer></script>
</head>

<body class="bg-[#eae9e4] text-black">
  <nav>
    <div
      class="w-full bg-white border-b border-gray-100 px-4 md:px-6 py-3 flex flex-wrap items-center justify-between gap-x-4 gap-y-3 text-gray-900 shadow-sm">
      <!-- Left Section: Logo & Delivery Info -->

      <div class="flex items-center gap-3 md:gap-4">
        <!-- Logo -->

        <a href="#" class="flex items-center gap-2 text-[#096a56]">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="text-[20px] md:text-[22px] font-bold tracking-tight">SwiftCart</span>
        </a>

        <!-- Vertical Divider (Hidden on small screens) -->

        <div class="hidden md:block w-px h-7 bg-gray-200"></div>

        <!-- Delivery Info Badge (Hidden on small screens) -->

        <div class="hidden md:flex flex-col justify-center bg-[#f5f4ef] px-2.5 py-1 rounded-md">
          <span class="text-[12px] font-bold leading-none mb-0.5">10-20 min</span>

          <span class="text-[11px] text-gray-700 leading-none">delivery</span>
        </div>
      </div>

      <!-- Middle Section: Search Bar -->

      <div
        class="order-3 md:order-none w-full md:w-auto md:flex-1 max-w-2xl flex items-stretch h-[42px] border border-gray-300 rounded-lg overflow-hidden focus-within:border-[#096a56] transition-colors">
        <!-- Location Dropdown -->

        <button
          class="bg-[#f5f4ef] px-3 md:px-4 flex items-center gap-1.5 border-r border-gray-300 hover:bg-[#eae9e4] transition-colors whitespace-nowrap">
          <i class="fa-solid fa-location-dot"></i>
          <span class="text-[13px] md:text-[14px] font-medium text-gray-800">Location</span>

          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path>
          </svg>
        </button>

        <!-- Search Input -->
        <form class="formBtn flex w-full px-3 md:px-4 " action="">
          <input type="text" placeholder="Search for groceries, froits, snacks & more"
            class="inputValue flex-1 w-full text-[13px] md:text-[14px] outline-none text-gray-800 placeholder-gray-500" />
        </form>

        <!-- Search Button -->

        <button class="bg-[#096a56] hover:bg-[#065041] px-4 md:px-5 flex items-center justify-center transition-colors">
          <i class="fa-solid fa-magnifying-glass text-white"></i>
        </button>
      </div>

      <!-- Right Section: User Actions -->

      <div class="flex items-center gap-5 md:gap-6">
        <!-- Login / Account -->

        <a href="#"
          class="hidden sm:flex items-center gap-2 hover:text-[#096a56] transition-colors cursor-pointer group">
          <span class="text-[14px] font-semibold text-gray-800 group-hover:text-[#096a56] transition-colors">Login /
            Account</span>
          <i class="fa-regular fa-user"></i>
        </a>

        <!-- Cart -->

        <a href="#" class="flex items-center gap-2 hover:text-[#096a56] transition-colors cursor-pointer group">
          <div class="relative">
            <i class="fa-solid fa-cart-shopping"></i>

            <!-- Item Count Badge -->

            <span
              class="addToCart absolute -top-1.5 -left-1.5 text-[10px] font-bold w-[18px] h-[18px] rounded-full flex items-center justify-center"></span>
          </div>

          <span
            class="text-[14px] font-semibold text-gray-800 hidden sm:block group-hover:text-[#096a56] transition-colors">Cart</span>
        </a>
      </div>
    </div>
  </nav>
  <div class="mainContainerTwo grid grid-cols-2 md:grid-cols-4 gap-5 m-5">
    <!-- Card 1 -->
    <!-- Card 2 -->
  </div>

</body>

</html>
