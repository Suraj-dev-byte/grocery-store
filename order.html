<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="src/css/output.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
  <link
    href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
    rel="stylesheet" />
  <script src="src/js/order.js" defer></script>
</head>

<body class="font-['Poppins']">
  <!-- Left Starting -->
  <div class="hidden p-4 xxl:fixed xl:top-6 xl:left-6 z-20 flex items-center gap-3">
    <a href="#"
      class="bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 px-5 rounded-lg shadow-sm transition text-sm flex items-center gap-2">
      <i class="fa-solid fa-bag-shopping"></i> Continue Shopping
    </a>
    <a href="#"
      class="bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-medium py-2.5 px-5 rounded-lg shadow-sm transition text-sm flex items-center gap-2">
      <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>
  </div>

  <main class="multipleProduct-Page max-w-6xl mx-auto px-4 py-8">
    <!-- Introduction & Headers -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-3xl font-bold tracking-tight text-gray-900">
            My Orders
          </h1>
          <span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">3 Active</span>
        </div>
        <p class="text-sm text-gray-500 mt-1">
          Track & manage your orders, deliveries, and past shopping insights.
        </p>
      </div>

      <!-- Modern Tab Pills -->
      <div class="flex flex-wrap gap-2 p-1 bg-gray-100/80 rounded-xl max-w-max">
        <button class="px-4 py-2 text-xs font-semibold rounded-lg bg-white text-gray-900 shadow-sm transition-all">
          <i class="fa-solid fa-list-ul mr-1.5 text-green-600"></i> All Orders
          (3)
        </button>
        <button
          class="px-4 py-2 text-xs font-medium rounded-lg text-gray-600 hover:text-gray-900 hover:bg-white/50 transition-all">
          <span class="inline-block w-2 h-2 rounded-full bg-amber-500 mr-1.5"></span>
          Processing
        </button>
        <button
          class="px-4 py-2 text-xs font-medium rounded-lg text-gray-600 hover:text-gray-900 hover:bg-white/50 transition-all">
          <span class="inline-block w-2 h-2 rounded-full bg-blue-500 mr-1.5"></span>
          Shipped
        </button>
        <button
          class="px-4 py-2 text-xs font-medium rounded-lg text-gray-600 hover:text-gray-900 hover:bg-white/50 transition-all">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-1.5"></span>
          Delivered
        </button>
      </div>
    </div>

    <!-- Split Screen Grid Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      <!-- Left Column: Highlight Tracker & Insights -->
      <div class="lg:col-span-4 space-y-6">

        <!-- Quick Insights -->
        <div class="bg-gray-50 border border-gray-200 rounded-2xl p-5">
          <h3 class="text-sm font-semibold text-gray-900 mb-3">
            Your OwnMart Insights
          </h3>
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-3.5 rounded-xl border border-gray-100">
              <span class="text-xs text-gray-500">Spend this month</span>
              <p class="text-lg font-bold text-gray-900 mt-0.5">$91.60</p>
            </div>
            <div class="bg-white p-3.5 rounded-xl border border-gray-100">
              <span class="text-xs text-gray-500">Orders completed</span>
              <p class="text-lg font-bold text-gray-900 mt-0.5">3 items</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Orders List -->
      <div class="lg:col-span-8 space-y-4">
        <!-- Order Card #1: Processing -->
        <div id="ordersContainer" class="max-w-xl mx-auto"></div>

      </div>
    </div>
  </main>



</body>

</html>
