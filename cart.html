<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="output.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body class="hidden bg-[#102334]">
  <!-- Full-screen centered loading overlay with premium gradient background -->
  <div class="fixed inset-0 z-50 flex flex-col items-center justify-center">

    <!-- Animation Container -->
    <div class="relative flex items-center justify-center w-20 h-20 mb-5">

      <!-- Premium background track for the spinner with inner shadow -->
      <div class="absolute inset-0 border-4 border-green-200/50 rounded-full shadow-inner"></div>

      <!-- Spinning animated border with subtle drop shadow -->
      <div class="absolute inset-0 border-4 border-green-500 rounded-full border-t-transparent animate-spin shadow-sm">
      </div>

      <!-- FontIcon: Grocery Shopping Bag (Requires FontAwesome CDN) -->
      <i class="fa-solid fa-shopping-bag text-2xl text-green-600"></i>

    </div>

    <!-- Loading Text with smooth pulse effect -->
    <p class="text-green-400 text-sm font-semibold tracking-wider animate-pulse uppercase">
      Loading products...
    </p>

  </div>
</body>

</html>
